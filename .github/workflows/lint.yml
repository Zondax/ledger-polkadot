name: Lint and format 💅

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - main
      - develop
      - master
      - dev

# cpp-linter posts its findings as a PR thread comment (thread-comments: true in
# _ledger_lint.yml). Without pull-requests: write that POST 403s and fails the job
# even when the lint itself is clean.
permissions:
  contents: read
  pull-requests: write

jobs:
  ledger-lint:
    uses: Zondax/_workflows/.github/workflows/_ledger_lint.yml@v3
    with:
      runs-on: ${{ github.repository_owner == 'zondax' && 'zondax-runners' || 'ubuntu-latest' }}
